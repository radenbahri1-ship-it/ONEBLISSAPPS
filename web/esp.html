<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitor ESP32 Kamar</title>
<style>body{margin:0;background:#0a0a0a;color:#fff;font:14px 'Segoe UI',system-ui,sans-serif;padding:16px}h1{font:600 20px Georgia,serif;color:#b69a6b;margin:0 0 12px}table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;border-bottom:1px solid #2c2722;text-align:left;white-space:nowrap}th{color:#a9a193;font-weight:500}.w{overflow-x:auto}.ok{color:#34d399}.er{color:#fb7185}.mu{color:#a9a193}#lg{margin-top:16px;font:12px monospace;color:#a9a193;max-height:240px;overflow:auto}a{color:#b69a6b}</style></head>
<body><h1>Monitor ESP32 Kamar <a href="/" style="font-size:13px">&larr; menu</a></h1><div class="w"><table><thead><tr><th>Kamar</th><th>Tamu</th><th>ESP</th><th>IP</th><th>Pass</th><th>Sesi</th><th>Relay</th><th>HP di WiFi</th><th>BLE tamu</th><th>Sisa pass</th><th>FW</th><th>Heap</th></tr></thead><tbody id="b"></tbody></table></div><div id="lg"></div>
<script>
let K=localStorage.getItem('hs_key_dev')||'';
const y=(v,t='ya',f='-')=>v==null?'<span class="mu">?</span>':v?'<span class="ok">'+t+'</span>':'<span class="mu">'+f+'</span>';
const fm=s=>s==null?'-':s>=3600?Math.floor(s/3600)+' j '+Math.floor(s%3600/60)+' m':Math.floor(s/60)+' m';
async function t(){try{const r=await fetch('/hs/esp',{headers:{'X-HS':K},cache:'no-store'});if(r.status==403){localStorage.removeItem('hs_key_dev');document.getElementById('b').innerHTML='<tr><td colspan=12 class=er>Akses ditolak. Buka dari komputer server (localhost:8088/esp).</td></tr>';return}const j=await r.json();
document.getElementById('b').innerHTML=Object.keys(j.rooms).sort().map(n=>{const x=j.rooms[n];return `<tr><td><b>${n}</b></td><td>${x.guest?(x.name||'terisi'):'<span class=mu>kosong</span>'}</td><td>${x.online==null?'<span class=mu>belum dicek</span>':x.online?'<span class=ok>ONLINE</span>':'<span class=er>OFFLINE</span>'}</td><td class=mu>${x.ip||'-'}</td><td>${y(x.has)}</td><td>${y(x.session,'di kamar')}</td><td>${y(x.relay,'ON','OFF')}</td><td>${x.wifi==null?'<span class=mu>-</span>':x.wifi?'<span class=ok>terhubung</span> <span class=mu>'+(x.gip||'')+'</span>':'<span class=er>tidak terjawab</span>'}</td><td>${y(x.present,'terdeteksi','tidak')}</td><td>${fm(x.expLeft)}</td><td class=mu>${x.fw||'-'}</td><td class=mu>${x.heap?Math.round(x.heap/1024)+' KB':'-'}</td></tr>`}).join('')||'<tr><td colspan=12 class=mu>Belum ada data kamar. Buka halaman resepsionis dulu.</td></tr>';
document.getElementById('lg').innerHTML=j.log.slice().reverse().map(e=>`<div class="${e.ok?'':'er'}">${new Date(e.t*1000).toLocaleTimeString()} kamar ${e.room}: ${e.msg}</div>`).join('')}catch(e){}}
t();setInterval(t,3000);
</script></body></html>
